name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          # The nearest vX.Y.Z git tag is the app version's single source of truth.
          # The default depth of 1 fetches no tags, which would silently fall back
          # to version 0.0.0. See the git-derived version block in app/build.gradle.kts.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      # Runner-default CodeQL (currently 2.27.0) caps Kotlin at < 2.4.20; bundle v2.27.1
      # (Java/Kotlin library 9.3.1) adds Kotlin 2.4.20. Drop this pin once the default catches up.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.gz

      - name: Build
        run: ./gradlew assembleDebug test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4