name: "Semgrep"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container:
      # Source-based SAST (tree-sitter parser) — immune to the Kotlin-version lag that
      # CodeQL hit (see codeql.yml). Pin the tag and bump manually; Dependabot does not
      # track container image tags.
      image: semgrep/semgrep:1.176.1
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        # No --error: findings are reported to code scanning (Security tab) without
        # failing CI. Validate rule packs locally before changing them — p/android does
        # not exist (HTTP 404), p/kotlin + p/java + p/owasp-top-ten resolve to ~560 rules.
        run: semgrep scan --config p/kotlin --config p/java --config p/owasp-top-ten --metrics=off --sarif > semgrep.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        if: always()