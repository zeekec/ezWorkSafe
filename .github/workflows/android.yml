name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > release.keystore

      - name: Create keystore.properties
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_PROPS_B64: ${{ secrets.KEYSTORE_PROPERTIES_B64 }}
        run: echo "$KEYSTORE_PROPS_B64" | base64 -d > keystore.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        if: env.KEYSTORE_B64 != ''
        run: ./gradlew assembleRelease

      - name: Upload release APK
        if: success() && env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ezWorkSafe-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage report
        run: ./gradlew createDebugUnitTestCoverageReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/coverage/**/*

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/coverage/test/debug/report.xml
          verbose: true
          fail_ci_if_error: true
