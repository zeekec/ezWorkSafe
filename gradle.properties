org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# NOTE: the app version is derived from the nearest vX.Y.Z git tag in
# app/build.gradle.kts, not stored here. Adding it back reintroduces a second
# source of truth that silently drifts from the tag. CI also overrides it via
# -PversionName / -PversionCode (see .github/workflows/release.yml).

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
org.gradle.configuration-cache=true
